name: Run HR agents
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests.mjs
      - run: |
          git config user.name "talentbridge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs out
          git diff --cached --quiet || git commit -m "Agents ran: update ledger"
          git push
